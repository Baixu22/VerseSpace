name: CI

# Single PR/push pipeline: one `changes` job evaluates path filters, every
# downstream job gates on exactly one output, so a change only runs the suites
# it can affect (a docs-only PR runs just Biome; a workbench-ui-only PR skips
# the workbench/context-rot lanes; etc.).
#
# Filters compose via YAML anchors — `global` (CI config, lockfile, root
# tooling, build scripts) is folded into every category, so a cross-cutting
# tooling change force-runs the full suite and can never silently skip a lane.
# paths-filter flattens nested anchor lists.
#
# macOS is the upstream reference platform; the windows-* jobs mirror the
# platform-sensitive parts on windows-latest (process/fs/paths/executable
# boundaries, win32 branches in the three packages).
#
# Scope note (ADR-0015): the legacy Helmor lanes — Rust/clippy/nextest, the
# `src/` frontend suite, the sidecar suite, Playwright e2e and the Tauri app
# build — were removed together with `src/`, `src-tauri/` and `sidecar/`.
# What remains is the three mainline packages: `packages/workbench`,
# `packages/context-rot`, `apps/workbench-ui`.

on:
  pull_request:
  push:
    branches:
      - main
      - windows-port
  # Manual entry point. Without this, a feature branch that never opens a PR
  # gets no CI at all: `pull_request` needs a PR and `push` only covers the two
  # branches above, so "what does CI say about this SHA" had no answer
  # (2026-09-16: the last CI run was 2026-09-11, on main). Dispatch requires the
  # workflow to exist on the default branch, so this only takes effect once it
  # lands on main. Still push/PR-gated for normal work — this adds no automatic
  # runs.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CI: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      biome: ${{ steps.filter.outputs.biome }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      workbench: ${{ steps.filter.outputs.workbench }}
      workbench_ui: ${{ steps.filter.outputs.workbench_ui }}
      context_rot: ${{ steps.filter.outputs.context_rot }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            global: &global
              - '.github/**'
              - 'package.json'
              - 'bun.lock'
              - 'biome.json'
              - 'scripts/**'
            workbench: &workbench
              - *global
              - 'packages/workbench/**'
              - 'packages/context-rot/**'
            # The dashboard's own vitest target lives beside its sources under
            # apps/workbench-ui and is NOT collected by any other suite. It ran
            # nowhere in CI until 2026-09-13 — a suite that never runs is a
            # suite that silently rots (found while triaging a false "baseline
            # red").
            workbench_ui: &workbench_ui
              - *global
              - 'apps/workbench-ui/**'
            context_rot: &context_rot
              - *global
              - 'packages/context-rot/**'
            # Root `bun run typecheck` walks all three packages; gate it on the
            # union so no package can change without its tsc running.
            typecheck:
              - *workbench
              - *workbench_ui
            # Biome lints the whole repo (biome.json includes: ["**"]), so gate
            # on every extension Biome can parse, anywhere — this mirrors
            # `biome check .` instead of trying to enumerate directories.
            biome:
              - *global
              - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,html,vue,svelte,astro,graphql}'

  # ---------- Quality ----------

  biome:
    name: Biome
    needs: changes
    if: needs.changes.outputs.biome == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Run Biome
        run: bunx biome check . --config-path=./biome.json

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Run typecheck
        run: bun run typecheck

  # ---------- Test ----------

  workbench-test:
    name: Workbench Test
    needs: changes
    if: needs.changes.outputs.workbench == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Run workbench tests
        shell: bash
        run: bun run test:workbench

  workbench-ui-test:
    name: Workbench UI Test
    needs: changes
    if: needs.changes.outputs.workbench_ui == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      # Must run with cwd inside apps/workbench-ui (the package's own
      # `test` script). Passing `--root apps/workbench-ui` instead breaks
      # vi.mock resolution: the factory mock registers under a module id the
      # importing code never resolves to, so mocks silently no-op and every
      # mocked test fails with "not a function".
      - name: Run workbench UI tests
        run: bun run test:workbench-ui

  context-rot-test:
    name: Context Rot Test
    needs: changes
    if: needs.changes.outputs.context_rot == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Run context-rot tests
        run: bun run test:context-rot

  # ---------- Windows ----------

  windows-typecheck:
    name: Windows Typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      # The three packages carry win32 branches (`process.platform ===
      # "win32"`) that the macOS typecheck never instantiates.
      - name: Run typecheck
        shell: bash
        run: bun run typecheck

  windows-workbench-test:
    name: Windows Workbench Test
    needs: changes
    if: needs.changes.outputs.workbench == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Run workbench tests
        shell: bash
        run: bun run test:workbench
