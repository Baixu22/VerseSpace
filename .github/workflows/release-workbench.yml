name: Release Workbench

# Builds the compiled workbench binaries for every release target and attaches
# them to the GitHub Release for the pushed `workbench-v*` tag.
#
# Workbench releases use `workbench-v*`. The legacy `v*` publish workflow was
# retired under ADR-0015; root package versions do not select this release.

on:
  push:
    tags:
      - "workbench-v*"

permissions:
  contents: write

concurrency:
  group: release-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            bun-target: bun-windows-x64
            artifact: workbench-windows-x64.exe
          - target: linux-x64
            os: ubuntu-latest
            bun-target: bun-linux-x64
            artifact: workbench-linux-x64
          - target: macos-arm64
            os: macos-latest
            bun-target: bun-darwin-arm64
            artifact: workbench-macos-arm64
          - target: macos-x64
            os: macos-latest
            bun-target: bun-darwin-x64
            artifact: workbench-macos-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Test
        shell: bash
        run: bun run test:workbench

      - name: Build binary
        shell: bash
        run: |
          cd packages/workbench
          bun run scripts/build-single.ts "${{ matrix.bun-target }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.target }}
          # The attribution files ride along so every artifact zip carries
          # NOTICE (Apache-2.0 §4(d)); build-single.ts copies them into dist/.
          path: |
            packages/workbench/dist/${{ matrix.artifact }}
            packages/workbench/dist/NOTICE
            packages/workbench/dist/LICENSE
            packages/workbench/dist/LICENSE-APACHE
          if-no-files-found: error

  release:
    name: Attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Attribution travels with the binaries, not only with the source
          # tarball — Apache-2.0 §4(d) applies to the distributed binaries.
          files: |
            dist/workbench-*
            dist/NOTICE
            dist/LICENSE
            dist/LICENSE-APACHE
          fail_on_unmatched_files: true
