# codex 验证用 profile（TF-0281 / ADR-0017 的前置条件）
#
# 为什么不直接用宿主默认：本机 ~/.codex/config.toml 的默认是
#   model_provider = "custom" / model = "grok-4.7" / base_url = "http://127.0.0.1:15721/v1"
# 而验收要求「不能用默认模型」。所以验证跑在一个**隔离的 CODEX_HOME** 里，
# 由这份 profile 指定我们配置的第三方模型；密钥只从环境变量取，不落任何文件。
#
# 用法（密钥仅经环境变量）：
#   $env:CODEX_HOME = "<repo>\.agent-contexts\codex-verify"
#   $env:WB_VERIFY_LLM_KEY = "<key>"
#   codex exec --skip-git-repo-check -C <隔离工作区> "prompt"
#
# workbench 的 codex 车道不传模型（packages/workbench/src/chat/codex-app-server/protocol.ts
# 的默认命令是 `codex app-server -c notify=[]`），它完全走 CODEX_HOME 的这份配置，
# 所以车道要跑在验证模型上，只需给子进程同样的 CODEX_HOME。

model = "glm-5.3-flash"
model_provider = "wb_verify"
model_reasoning_effort = "high"
sandbox_mode = "danger-full-access"
# TF-0263 option A 的前提：codex 必须**询问审批**，否则写根本不经过 approval 请求，
# 封印就没有拦截点（实测 2026-09-26：不询问时写入直接落盘，seal 一次都没被咨询）。
# sandbox 必须同时允许写入，否则「封印挡住了」与「codex 沙箱挡住了」无法区分；
# 判据只能靠对照——同样的配置下，前提新鲜时写入应当成功。
approval_policy = "on-request"  # "untrusted" 在 codex 0.158 已废弃（实测报错）

# Windows: 不设 [windows] sandbox 时 codex 会退回 read-only（实测 2026-09-26）。
# 验证写侧必须让 codex 真的能写——否则无法区分「seal 挡住」与「codex 挡住」。
[windows]
sandbox = "elevated"

[model_providers.wb_verify]
name = "wb_verify"
base_url = "http://127.0.0.1:3065/v1"
wire_api = "responses"
env_key = "WB_VERIFY_LLM_KEY"
