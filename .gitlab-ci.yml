# GitLab CI — runs on a self-managed runner on the developer Windows machine.
#
# Why not GitLab-hosted runners (2026-09-21): free-plan identity verification
# blocks CI jobs, and phone SMS verification is Unsupported for China (+86).
# Official alternative: project / self-managed runners. The runner lives at
# D:\software\gitlab-runner (tags: verspace-local, windows, self-hosted) and
# uses the machine's existing Bun 1.3.14 install — no SaaS compute minutes.
#
# GitHub still hosts the repo, PRs and Releases. A branch that needs CI:
#
#   git push origin <branch>   # GitHub — updates the PR
#   git push gitlab <branch>   # GitLab  — this pipeline (machine must be on)
#
# Translation notes vs .github/workflows/ci.yml:
# - Path filters stay as `rules: changes` so a docs-only push does not re-run
#   the full suite on a single shared box.
# - All jobs target tag `verspace-local` (shell + powershell). Docker images
#   and GitHub-hosted OS matrices do not apply.
# - concurrent=1 in the runner config — the 16 GB host must not run the UI
#   suite and heavy builds at the same time (see AGENTS.md).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  tags: [verspace-local]
  interruptible: true

variables:
  BUN_VERSION: "1.3.14"
  # Keep bun on PATH even if the runner service environment is reset.
  BUN_BIN: "C:\\Users\\27933\\AppData\\Roaming\\npm\\node_modules\\bun\\bin"

stages: [verify]

.paths:
  global:
    - .gitlab-ci.yml
    - .github/**
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
  biome:
    - .gitlab-ci.yml
    - .github/**
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,html,vue,svelte,astro,graphql}'
  typecheck:
    - .gitlab-ci.yml
    - .github/**
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - packages/workbench/**
    - packages/context-rot/**
    - apps/workbench-ui/**
  workbench:
    - .gitlab-ci.yml
    - .github/**
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - packages/workbench/**
    - packages/context-rot/**
  workbench_ui:
    - .gitlab-ci.yml
    - .github/**
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - apps/workbench-ui/**
  context_rot:
    - .gitlab-ci.yml
    - .github/**
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - packages/context-rot/**

pipeline-heartbeat:
  stage: verify
  script:
    - Write-Host "pipeline for $env:CI_COMMIT_REF_SLUG — self-managed runner verspace-local"

.bun-setup:
  before_script:
    - $env:PATH = "$env:BUN_BIN;$env:PATH"
    - bun --version
    - bun install --frozen-lockfile

biome:
  extends: .bun-setup
  stage: verify
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, biome]
  script:
    - bun x biome check . --config-path=./biome.json

typecheck:
  extends: .bun-setup
  stage: verify
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, typecheck]
  script:
    - bun run typecheck

workbench-test:
  extends: .bun-setup
  stage: verify
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, workbench]
  script:
    - bun run test:workbench

workbench-ui-test:
  extends: .bun-setup
  stage: verify
  timeout: 25m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, workbench_ui]
  script:
    - bun run test:workbench-ui
    - bun run build:ui

context-rot-test:
  extends: .bun-setup
  stage: verify
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, context_rot]
  script:
    - bun run test:context-rot
