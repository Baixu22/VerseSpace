# GitLab CI — runs on a self-managed runner on the developer Windows machine.
#
# Instance: **jihulab.com** (GitLab China / 极狐). The gitlab.com runners this
# lane was originally written for were torn down on 2026-09-22
# (D:\software\gitlab-runner\config.toml.bak-pre-gitlab-teardown); the runner
# now registered is `verspace-local-jihulab` (id 47590). Why not GitLab-hosted
# runners (2026-09-21): free-plan identity verification blocks CI jobs, and
# phone SMS verification is Unsupported for China (+86). Official alternative:
# project / self-managed runners. The runner lives at D:\software\gitlab-runner
# (tags: verspace-local, windows, self-hosted, builds under builds-jh) and uses
# the machine's existing Bun 1.3.14 install — no SaaS compute minutes.
#
# GitHub still hosts the repo, PRs and Releases. A branch that needs CI:
#
#   git push origin <branch>   # GitHub — updates the PR
#   "C:\Program Files\Git\bin\bash.exe" scripts/win/jihulab-snapshot.sh [ref]
#                              # JihuLab — this pipeline (bash on PATH is WSL here)
#
# The second line is a script, not a plain push, on purpose: the local .git
# carries ~2 GB of events.jsonl history, so pushing real history would drag all
# of it up. The script force-pushes an orphan single-commit snapshot to a FLAT
# ref name — `main` and `feat/*` are protected on jihulab and reject a
# force-push. The machine must be on for the runner to pick the job up.
#
# This is the only CI lane (ADR-0018): the GitHub Actions workflows were
# deleted, so there is no GitHub status check to compare against any more.
#
# Notes:
# - Path filters stay as `rules: changes` so a docs-only push does not re-run
#   the full suite on a single shared box. `changes` compares against the
#   previous snapshot of this ref, so re-pushing an unchanged tree creates an
#   empty pipeline (no jobs, nothing in the runner log).
# - All jobs target tag `verspace-local` (shell + pwsh). Docker images and
#   OS matrices do not apply.
# - The heavy jobs share `resource_group: heavy`: `concurrent = 4` while the
#   host has 16 GB, and running the UI suite, the workbench suite and tsc at
#   once made workbench-test exit 1 after a full run (2026-09-22).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  tags: [verspace-local]
  interruptible: true

variables:
  BUN_VERSION: "1.3.14"
  # Full history: merge-author safety-net tests read git log authors.
  GIT_DEPTH: "0"
  # Keep bun/node on PATH even if the runner service environment is reset.
  BUN_BIN: "C:\\Users\\27933\\AppData\\Roaming\\npm\\node_modules\\bun\\bin"
  NODE_BIN_DIR: "C:\\Program Files\\nodejs"
  CONTEXT_ROT_NODE: "C:\\Program Files\\nodejs\\node.exe"

stages: [verify, release]

.paths:
  global:
    - .gitlab-ci.yml
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
  biome:
    - .gitlab-ci.yml
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,html,vue,svelte,astro,graphql}'
  typecheck:
    - .gitlab-ci.yml
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - packages/workbench/**
    - packages/context-rot/**
    - apps/workbench-ui/**
  workbench:
    - .gitlab-ci.yml
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - packages/workbench/**
    - packages/context-rot/**
  workbench_ui:
    - .gitlab-ci.yml
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - apps/workbench-ui/**
  context_rot:
    - .gitlab-ci.yml
    - package.json
    - bun.lock
    - biome.json
    - scripts/**
    - packages/context-rot/**

pipeline-heartbeat:
  stage: verify
  script:
    - Write-Host "pipeline for $env:CI_COMMIT_REF_SLUG — self-managed runner verspace-local"

.bun-setup:
  before_script:
    - $env:PATH = "$env:NODE_BIN_DIR;$env:BUN_BIN;$env:PATH"
    - bun --version
    - node --version
    - bun install --frozen-lockfile

biome:
  extends: .bun-setup
  stage: verify
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, biome]
  script:
    - bun x biome check . --config-path=./biome.json

typecheck:
  extends: .bun-setup
  stage: verify
  timeout: 20m
  # Heavy jobs share one resource group: the runner is `concurrent = 4` while
  # the host has 16 GB, so without this a single push can start the UI suite,
  # the workbench suite and tsc at the same time (see AGENTS.md §"Windows test
  # concurrency"). Observed 2026-09-22: workbench-test ran its full 215s under
  # that contention and exited 1, while the same tree passed alone.
  resource_group: heavy
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, typecheck]
  script:
    - bun run typecheck

workbench-test:
  extends: .bun-setup
  stage: verify
  timeout: 20m
  resource_group: heavy
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, workbench]
  script:
    - bun run test:workbench

workbench-ui-test:
  extends: .bun-setup
  stage: verify
  timeout: 25m
  resource_group: heavy
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, workbench_ui]
  script:
    - bun run test:workbench-ui
    - bun run build:ui

context-rot-test:
  extends: .bun-setup
  stage: verify
  timeout: 20m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes: !reference [.paths, context_rot]
  script:
    - bun run test:context-rot

# Release lane (2026-09-21; instance switched to JihuLab 2026-09-22).
# The GitHub Actions release workflow was deleted under ADR-0018, so this is the
# only tag-triggered lane left — there is no second workflow describing an
# "intended shape" any more. All four binaries are cross-compiled by Bun on this
# Windows host; only windows-x64 has run the test suite, and the publish script
# says so in the release notes.
#
#   bun run release:tag:workbench --push   # origin: real tag; jihulab: snapshot tag
#   → release-build runs after verify      # artifacts: dist/workbench-* + legal
#   → release-publish is manual            # gh release create (host gh login)
#
# A release does not have to go through this lane: build locally with the same
# command (`cd packages/workbench && bun run build:all`) and publish with
# `node scripts/publish-workbench-release.mjs --tag workbench-v<version>`.
#
# The tag that reaches this instance points at an orphan snapshot commit with
# the same TREE as the released commit (see scripts/tag-workbench-release.mjs);
# `$CI_COMMIT_TAG` is what the rules match, and the tree is what gets built.

release-build:
  extends: .bun-setup
  stage: release
  timeout: 30m
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^workbench-v/
  script:
    - Set-Location packages/workbench
    - bun run build:all
    - Get-ChildItem dist
  artifacts:
    name: "workbench-$CI_COMMIT_TAG"
    expire_in: 30 days
    paths:
      - packages/workbench/dist/workbench-*
      - packages/workbench/dist/NOTICE
      - packages/workbench/dist/LICENSE
      - packages/workbench/dist/LICENSE-APACHE

release-publish:
  stage: release
  needs: [release-build]
  timeout: 10m
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^workbench-v/
      when: manual
  script:
    - $env:PATH = "$env:NODE_BIN_DIR;$env:PATH"
    - node scripts/publish-workbench-release.mjs --tag $env:CI_COMMIT_TAG
